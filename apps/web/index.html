<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script data-lexii-theme-init>
      // 在首次渲染前应用主题，避免深色偏好用户看到浅色闪烁（FOUC）。
      // 解析规则必须与 src/theme/resolve.ts 保持一致（themeInitScript.test.ts 会校验）。
      // RAY-261 三档偏好：存储值为 light / dark 时直接采用；system（及缺失/非法值）
      // 跟随系统 prefers-color-scheme；「跟随系统」档位的后续自动切换由 useTheme 监听。
      (function () {
        try {
          var stored = window.localStorage.getItem("lexii:theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          // localStorage / matchMedia 不可用时保持默认浅色，React 挂载后由 useTheme 兜底
        }
      })();
    </script>
    <!--
      初始值 = tokens.css :root 的浅色 --lex-bg，仅作首帧渲染前 / 无 JS 兜底；
      深色模式由 useTheme 运行时读取 --lex-bg token 同步更新（src/theme/themeColor.ts）。
      themeColor.test.ts 会校验此处与 token 一致，防止两处漂移。
    -->
    <meta name="theme-color" content="#fafaf9" />
    <meta
      name="description"
      content="乐希 Lexii — 定制化背单词体验：现代简洁、多语言、支持导入词库、local-first"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!--
      卡片字体（RAY-323）：4 档 Google Fonts 在首帧渲染前到达。
      选 `preconnect` 把 DNS / TLS 握手当字体 CSS 真正请求的并行预热，
      减少设置页/复习卡首次切档时的字体回退闪烁（FOIT / FOUT）；
      `font-display: swap` 在 url() 串中已声明，字体到达前会先以
      系统等线字体渲染，下载完成后平滑替换。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Newsreader:wght@600&family=Playpen+Sans:wght@600&family=Google+Sans+Flex:wght@500&display=swap"
    />
    <title>乐希 Lexii</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
