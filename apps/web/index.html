<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script data-lexii-theme-init>
      // 在首次渲染前应用主题，避免深色偏好用户看到浅色闪烁（FOUC）。
      // 解析规则必须与 src/theme/resolve.ts 保持一致（themeInitScript.test.ts 会校验）。
      // RAY-261 三档偏好：存储值为 light / dark 时直接采用；system（及缺失/非法值）
      // 跟随系统 prefers-color-scheme；「跟随系统」档位的后续自动切换由 useTheme 监听。
      (function () {
        try {
          var stored = window.localStorage.getItem("lexii:theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          // localStorage / matchMedia 不可用时保持默认浅色，React 挂载后由 useTheme 兜底
        }
      })();
    </script>
    <!--
      初始值 = tokens.css :root 的浅色 --lex-bg，仅作首帧渲染前 / 无 JS 兜底；
      深色模式由 useTheme 运行时读取 --lex-bg token 同步更新（src/theme/themeColor.ts）。
      themeColor.test.ts 会校验此处与 token 一致，防止两处漂移。
    -->
    <meta name="theme-color" content="#fafaf9" />
    <meta
      name="description"
      content="乐希 Lexii — 定制化背单词体验：现代简洁、多语言、支持导入词库、local-first"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!--
      卡片字体（RAY-323）：4 档 Google Fonts 在首帧渲染前到达。
      选 `preconnect` 把 DNS / TLS 握手当字体 CSS 真正请求的并行预热，
      减少设置页/复习卡首次切档时的字体回退闪烁（FOIT / FOUT）；
      `font-display: swap` 在 url() 串中已声明，字体到达前会先以
      系统等线字体渲染，下载完成后平滑替换。
      字重与 src/lib/cardFont.ts 的 CARD_FONT_OPTIONS.fontWeight 严格一致
      （Oscar 评审 suggestion 2）：inter 800 / 其余 600——不加载的字重会
      被浏览器合成导致字面失真。改动任一档字重必须三处同步：本 URL、
      CARD_FONT_OPTIONS.fontWeight、tokens.css 的 --lex-card-font-weight
      （以及 public/sw.js 的 CARD_FONT_CSS_URL，离线预缓存同一 URL）。
      RAY-338 A1：「现代简约」的主字体为自托管 Inter Display ExtraBold
      （下方 ./fonts/inter-display.css；Google Fonts 无 Inter Display），
      本 URL 中的 Inter 800 仅作安全网回退——unicode-range 子集化让浏览器
      在自托管命中时不再下载 Inter 字形文件，真实网络代价 ≈ 一个 CSS
      请求与共享的 preconnect；换来的是自托管 woff2 因部署/缓存未就绪
      而 404 时卡片仍能渲染 Inter ExtraBold（视觉与 Inter Display 接近）
      而非系统字体。Oscar 复核 nit 1 已知取舍，本 PR 不删 Inter preconnect
      与 URL 段；如未来要压到「首次无缓存请求最小」可考虑把 Inter 也改
      自托管（额外 ~30KB latin subset），但代价是双倍 woff2 体积与不再
      享受 Google Fonts 的 CDN 分发。
      RAY-361 S1：Inter 新增 400（400;800）供音标常规体使用（.lex-phonetic 400），
      与 800 共用同一 CSS 请求，增量约一个 woff2 子集；SW 预缓存同步此 URL。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&family=Newsreader:wght@600&family=Playpen+Sans:wght@600&family=Google+Sans+Flex:wght@600&display=swap"
    />
    <!--
      图标系统（RAY-363）：Google Material Symbols Outlined — 全量图标统一来源。
      与卡片字体同属 Google Fonts，利用上方 preconnect 并行预热，无额外 DNS 成本；
      `display=swap` 保证字体到达前不阻塞首帧渲染（走系统回退，swap 后平滑替换）。
      样式约定见 src/components/icons.tsx（MaterialIcon）与 src/styles/index.css。
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap"
    />
    <!-- RAY-338 A1：Inter Display ExtraBold 自托管（同源部署、子路径安全、离线预缓存） -->
    <link rel="stylesheet" href="./fonts/inter-display.css" />
    <title>乐希 Lexii</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
