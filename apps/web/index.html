<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script data-lexilexi-theme-init>
      // 在首次渲染前应用主题，避免深色偏好用户看到浅色闪烁（FOUC）。
      // 解析规则必须与 src/theme/resolve.ts 保持一致（themeInitScript.test.ts 会校验）。
      (function () {
        try {
          var stored = window.localStorage.getItem("lexilexi:theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          // localStorage / matchMedia 不可用时保持默认浅色，React 挂载后由 useTheme 兜底
        }
      })();
    </script>
    <!--
      初始值 = tokens.css :root 的浅色 --lex-bg，仅作首帧渲染前 / 无 JS 兜底；
      深色模式由 useTheme 运行时读取 --lex-bg token 同步更新（src/theme/themeColor.ts）。
      themeColor.test.ts 会校验此处与 token 一致，防止两处漂移。
    -->
    <meta name="theme-color" content="#fafaf9" />
    <meta
      name="description"
      content="乐希 Lexilexi — 定制化背单词体验：现代简洁、多语言、支持导入词库、local-first"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>乐希 Lexilexi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
