name: Deploy Dev（开发通道）

# RAY-297 任务 A（双通道部署架构，下半部分）：Dev 通道。
# - 自动触发：每次 main push（保留 RAY-241 以来的现状行为），发布到
#   Pages 的 /Lexilexi/dev/ 子路径；根路径不再被 main push 覆盖。
# - 手动触发：workflow_dispatch 保留，可对任意 ref 构建 dev 预览（默认 main）。
# - 与 deploy-release.yml 互补：每次部署都发布「自洽的完整站点」——dev/ 子目录
#   为本通道产物，根路径为最新 v* tag 的稳定版快照（无 tag 时回退当前 main，
#   保证首次双通道发布前站点不出现 404 空窗）。
#
# 构建信息注入（RAY-297 任务 B）：两次构建分别设置 LEXILEXI_CHANNEL 与
# BUILD_BRANCH，vite.config.ts 在构建时收集 SHA/时间/分支/通道/历史 tag，
# 运行时零网络请求。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建 dev 通道的 ref（默认：main）"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制（RAY-297 Oscar 评审 suggestion 1）：两通道共用同一部署串行队列。
# group 统一为 pages、cancel-in-progress: false —— 部署按触发顺序排队落盘：
# - 发版时 dev 部署（由 main 合入触发）与 release 部署（由 tag 推送触发）几乎
#   必然重叠，若各自并行且后落盘的 dev 携带上一版 tag 的根路径快照，
#   会把刚发布的稳定版覆盖回旧版；串行化后 release 部署总是最后落盘；
# - 不能用 true：反向顺序（dev 部署后触发）会把 release 部署取消掉，
#   且取消后无自动重触发，刚打的 tag 永远发不出去。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    name: 构建并发布（dev/ + 最新稳定版根路径）
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 全量历史：解析最新 tag、构建历史 Release 列表（__APP_BUILD__.releaseTags）
          fetch-depth: 0

      - name: 切到指定 ref（workflow_dispatch 手动指定时）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.ref != ''
        run: git checkout "${{ github.event.inputs.ref }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 构建 dev 通道（dev/ 子目录）
        run: pnpm --filter @lexilexi/web build
        env:
          LEXILEXI_CHANNEL: dev
          BUILD_BRANCH: ${{ github.event.inputs.ref || 'main' }}

      - name: 暂存 dev 产物
        run: |
          mkdir -p site/dev
          cp -a apps/web/dist/. site/dev/

      - name: 解析最新 v* tag（无 tag 时回退 main，保证首发前站点可用）
        shell: bash
        run: |
          tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$tag" ]; then
            git checkout "$tag"
            echo "BUILD_BRANCH=$tag" >> "$GITHUB_ENV"
          else
            git checkout main
            echo "BUILD_BRANCH=main" >> "$GITHUB_ENV"
          fi

      - name: 构建稳定版快照（根路径）
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @lexilexi/web build
          cp -a apps/web/dist/. site/
        env:
          LEXILEXI_CHANNEL: release
          BUILD_BRANCH: ${{ env.BUILD_BRANCH }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
