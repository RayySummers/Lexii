name: Deploy Dev（开发通道）

# RAY-297 任务 A（双通道部署架构，下半部分）：Dev 通道。
# - 自动触发：每次 main push（保留 RAY-241 以来的现状行为），发布到
#   Pages 的 /Lexii/dev/ 子路径；根路径不再被 main push 覆盖。
# - 手动触发：workflow_dispatch 保留，可对任意 ref 构建 dev 预览（默认 main）。
# - 与 deploy-release.yml 互补：每次部署都发布「自洽的完整站点」——dev/ 子目录
#   为本通道产物，根路径为最新 v* tag 的稳定版快照（无 tag 时回退当前 main，
#   保证首次双通道发布前站点不出现 404 空窗）。
#
# RAY-491（根路径新鲜度）：根路径不再取「checkout 时刻解析到的 tag」，而是写前
# 重新解析 + 与线上已部署构建信息比对、取三者最新（「解析根路径发布目标」step），
# 并在构建后、上传前再复检一次（「构建稳定版快照」step 的重建循环）。
#
# 构建信息注入（RAY-297 任务 B）：两次构建分别设置 LEXII_CHANNEL 与
# BUILD_BRANCH，vite.config.ts 在构建时收集 SHA/时间/分支/通道/历史 tag，
# 运行时零网络请求。
#
# RAY-300：Tier 1/2 扩展词包构建并入 Pages 部署——presets 产物随 Pages 一起
# 发布到 /dev/presets/ 和根路径 /presets/，使 Rayy 可直接在浏览器验收 RAY-294。
# 构建逻辑与 publish-presets.yml 口径一致（同一脚本、同一 ECDICT 固定 commit）。
#
# Suggestion 2 镜像语义：presets 仅从当前触发 ref 构建一次，产物镜像到两个通道目录。
# - dev 通道（/dev/presets/）：用 main 的脚本产物 ✅ 与 dev 页面内容一致
# - 根路径（/presets/）：镜像 main 的 presets 产物，站点内容为最新 tag 快照
# 当前 main 与最新 tag 的 preset 脚本一致且 ECDICT 数据 commit 固定，实际内容无差异；
# 若未来脚本分叉，需改为按各自 ref 独立构建（见 Nit 1 的 composite action 封装）。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建 dev 通道的 ref（默认：main）"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制（RAY-297 Oscar 评审 suggestion 1）：两通道共用同一部署串行队列。
# group 统一为 pages、cancel-in-progress: false —— 部署按触发顺序排队落盘：
# - 发版时 dev 部署（由 main 合入触发）与 release 部署（由 tag 推送触发）几乎
#   必然重叠，若各自并行且后落盘的 dev 携带上一版 tag 的根路径快照，
#   会把刚发布的稳定版覆盖回旧版；串行化后 release 部署总是最后落盘；
# - 不能用 true：反向顺序（dev 部署后触发）会把 release 部署取消掉，
#   且取消后无自动重触发，刚打的 tag 永远发不出去。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    name: 构建并发布（dev/ + 最新稳定版根路径）
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 全量历史：解析最新 tag、构建历史 Release 列表（__APP_BUILD__.releaseTags）
          fetch-depth: 0

      - name: 切到指定 ref（workflow_dispatch 手动指定时）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.ref != ''
        run: git checkout "${{ github.event.inputs.ref }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      #─── RAY-300：构建 Tier 1/2 扩展词包（并入 Pages 部署） ──────────
      # 使用 composite action 封装 5 步构建块（Nit 1），防口径漂移。
      # 全限定引用 @main：workflow_dispatch 时工作树可能切到旧 ref（无此 action），
      # 本地引用 `uses: ./.github/actions/build-presets` 会报 "Can't find action.yml"。
      - name: 构建 Tier 1/2 扩展词包
        uses: RayySummers/Lexii/.github/actions/build-presets@main

      - name: 构建 dev 通道（dev/ 子目录）
        run: pnpm --filter @lexii/web build
        env:
          LEXII_CHANNEL: dev
          BUILD_BRANCH: ${{ github.event.inputs.ref || 'main' }}

      - name: 暂存 dev 产物
        run: |
          mkdir -p site/dev
          cp -a apps/web/dist/. site/dev/

      - name: 暂存 dev 词包（presets → dev/presets/）
        run: |
          mkdir -p site/dev/presets
          cp -a scripts/presets/output/presets/. site/dev/presets/

      # RAY-491（根因修复）：写根路径前做**新鲜度判定**，而不是「谁后完成谁生效」。
      #
      # 事故形态：本 step 原来在 checkout 那一刻解析「最新 v* tag」，而 runner 上的
      # tag 列表是那次 checkout 的快照 —— 发版 tag 若是这次构建开始之后才推上去的，
      # 这里根本看不到它；dev 构建又比 release 慢、落盘更晚，于是把刚发布的稳定版
      # 覆盖回了上一版（concurrency: pages 只能保证队列顺序，不能保证内容新鲜）。
      #
      # 修复：① 先 git fetch --tags 拿到此刻权威 tag 集合；② 再把线上根路径已部署
      # 的 build-info.json（channel/sha/time/branch/releaseTags）读回来，三方取最新；
      # ③ 结果写入 ROOT_BRANCH/ROOT_ACTION/ROOT_REASON，根路径只构建最新的那份快照。
      # 判定逻辑与单测：scripts/pages-channel-lib.mjs、scripts/test-pages-channels.mjs。
      - name: 解析根路径发布目标（新鲜度判定：绝不降级）
        shell: bash
        run: |
          git fetch --tags --force origin
          candidate="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          candidate="${candidate:-main}"
          echo "本次 checkout 解析到的候选 tag：$candidate"
          node scripts/resolve-pages-root.mjs --candidate "$candidate" --github-env "$GITHUB_ENV"

      # 构建 → 部署前复检 → 若构建这 1~3 分钟里又推了新 tag 就重建（最多 3 次）。
      # 为什么需要这一层：同一 concurrency 组默认只允许 1 个 pending run
      # （queue: single），新排队的 run 会**取代/取消**已有的 pending run —— 队列不是
      # 严格 FIFO；再叠加「触发时间 ≠ 作业真正开始时间」，「谁后落盘」不能只按触发
      # 顺序推断。所以即便构建前判定过，仍要覆盖「判定之后、落盘之前」这段窗口。
      # 复检不通过就重构建，且任何一次迭代的 artifact 都是「根路径有内容」的完整站点
      # （Pages 整站替换，根路径永远不能空）。
      # RAY-333 Bug A 修复：旧 tag（如 v0.1.0-alpha.8.1）切到的 commit 包名是
      # `@lexilexi/web`（typo，已被 PR #71 修正），`pnpm --filter @lexii/web build`
      # 会返回 "No projects matched" 但 pnpm 静默 0 退出（filter 无匹配视为软失败），
      # 后续 `cp` 把上一步遗留的 dev 构建复制到根路径，根路径被 dev 通道污染。
      # 修复：先校验 apps/web/package.json 的 name 字段是预期的 @lexii/web，
      # 不匹配则 ::error:: 硬失败，避免坏 artifact 进入 Pages。
      - name: 构建稳定版快照（根路径，带部署前复检，最多重建 2 次）
        shell: bash
        run: |
          if [ -z "$ROOT_BRANCH" ]; then
            echo "::error::新鲜度判定没有给出根路径目标 tag（ROOT_BRANCH 为空）。请检查 steps 日志里 scripts/resolve-pages-root.mjs 的输出。" >&2
            exit 1
          fi
          for attempt in 1 2 3; do
            export BUILD_BRANCH="$ROOT_BRANCH"
            echo "── 第 $attempt 次根路径构建：$BUILD_BRANCH ──"
            git checkout "$BUILD_BRANCH"
            pnpm install --frozen-lockfile
            pkg_name="$(node -p "try { require('./apps/web/package.json').name } catch (e) { '' }" 2>/dev/null || echo "")"
            if [ "$pkg_name" != "@lexii/web" ]; then
              echo "::error::@lexii/web 工作区在 ref $BUILD_BRANCH 不存在或 package 名错误（实际：'${pkg_name}'）。常见原因：BUILD_BRANCH 解析到了一个旧 tag（其 apps/web/package.json 的 name 是 @lexilexi/web 等历史拼写），或工作区结构与当前不兼容。请确认 BUILD_BRANCH 解析正确后再重试。" >&2
              exit 1
            fi
            pnpm --filter @lexii/web build
            # 只替换根路径的 assets（site/dev/assets 属于 dev 通道，不能动）
            rm -rf site/assets
            cp -a apps/web/dist/. site/
            echo "根路径构建完成：$(node -p "JSON.stringify(require('./apps/web/dist/build-info.json'))")"
            # 部署前复检：构建期间若有更新的 tag 落库，根路径必须跟着升，不能降
            node scripts/resolve-pages-root.mjs --candidate "$BUILD_BRANCH" --github-env "$GITHUB_ENV"
            if [ "$ROOT_BRANCH" = "$BUILD_BRANCH" ]; then
              echo "根路径目标稳定：$ROOT_BRANCH"
              break
            fi
            echo "::warning::构建期间出现更新的 tag：$ROOT_BRANCH（本次已构建 $BUILD_BRANCH），重建根路径"
          done
          if [ "$ROOT_BRANCH" != "$BUILD_BRANCH" ]; then
            echo "::error::根路径目标在 3 次构建间持续变化（最后构建 $BUILD_BRANCH，期望 $ROOT_BRANCH）。本次不发 Pages，避免用旧快照覆盖稳定通道；稍后重新触发 Dev 部署即可。" >&2
            exit 1
          fi
        env:
          LEXII_CHANNEL: release

      - name: 暂存稳定版词包（presets → presets/）
        run: |
          mkdir -p site/presets
          cp -a scripts/presets/output/presets/. site/presets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
