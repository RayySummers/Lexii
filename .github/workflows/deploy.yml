name: Deploy (GitHub Pages)

# alpha 静态托管部署（RAY-241）：
# - main 每次 push 自动构建并发布到 GitHub Pages（rayysummers.github.io/Lexilexi/）。
# - 产物已按「相对 base（./）」构建（apps/web/vite.config.ts），可部署在 /Lexilexi/ 子路径，
#   PWA 的 manifest / sw.js / 图标同样按相对自身位置解析，无需按环境改写。
# - 手动触发（workflow_dispatch）可用于发布任意分支的预览构建。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
